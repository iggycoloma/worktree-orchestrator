name: debug-macos

on:
  push:
    branches: [debug-macos]

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: environment
        run: |
          bash --version | head -1
          which rsync && rsync --version 2>&1 | head -2 || echo "no rsync"
      - name: wt add with stderr
        run: |
          set -x
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_AUTHOR_NAME=t GIT_AUTHOR_EMAIL=t@e.c GIT_COMMITTER_NAME=t GIT_COMMITTER_EMAIL=t@e.c
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          git config --global init.defaultBranch main
          git config --global worktree.useRelativePaths true
          T=$(mktemp -d)
          git init -q --bare "$T/remote.git"
          git clone -q "$T/remote.git" "$T/seed" 2>/dev/null || true
          printf '.env\n.env.*\n' > "$T/seed/.gitignore"
          git -C "$T/seed" add -A
          git -C "$T/seed" commit -q -m init
          git -C "$T/seed" push -q origin HEAD
          bash bin/wt init "$T/remote.git" "$T/proj"
          WT="$PWD/bin/wt"
          cd "$T/proj"
          bash "$WT" add issue-123
          echo "add rc=$?"
