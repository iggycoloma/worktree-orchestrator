name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR bin/wt install.sh tests/test-wt.sh tests/test-framework.sh completions/wt.bash

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # wt requires flock for the port registry; macOS does not ship it
      # (Linux has it via util-linux).
      - name: install flock
        if: runner.os == 'macOS'
        run: brew install flock
      - name: test suite
        run: bash tests/test-wt.sh
      # macOS ships bash 3.2 at /bin/bash, which is wt's declared floor;
      # the plain `bash` above resolves to a newer Homebrew build.
      - name: test suite (bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash tests/test-wt.sh

  # Single stable context for branch protection: the ruleset requires
  # "CI Summary" rather than enumerating matrix legs, so adding an OS to
  # the test matrix never desynchronizes the required-checks list.
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [shellcheck, test]
    if: always()
    steps:
      - name: check job results
        run: |
          if [ "${{ needs.shellcheck.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ]; then
            echo "all checks passed"
          else
            echo "shellcheck: ${{ needs.shellcheck.result }}, test: ${{ needs.test.result }}"
            exit 1
          fi
