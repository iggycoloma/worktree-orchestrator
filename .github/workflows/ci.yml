name: ci

on:
  push:
    branches: [main, debug-macos]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR bin/wt tests/test-wt.sh tests/test-framework.sh completions/wt.bash

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # wt requires flock for the port registry; macOS does not ship it
      # (Linux has it via util-linux).
      - name: install flock
        if: runner.os == 'macOS'
        run: brew install flock
      - name: test suite
        run: bash tests/test-wt.sh
      # macOS ships bash 3.2 at /bin/bash, which is wt's declared floor;
      # the plain `bash` above resolves to a newer Homebrew build.
      - name: test suite (bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash tests/test-wt.sh
